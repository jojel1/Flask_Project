<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pig Feeder Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        /* Green bars at the top and bottom */

        .green-bar {
            width: 100%;
            height: 24px;
            flex-shrink: 0;
            background-color: #15803d;
        }

        /* Main page area */

        .page-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Login card */

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 35px 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            margin: 0 0 8px;
            text-align: center;
            color: #15803d;
            font-size: 27px;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        /* SNSU logo */

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 0 18px;
        }

        .snsu-logo {
            width: 125px;
            height: 125px;
            object-fit: contain;
        }

        /* University name */

        .university-name {
            margin: 0 0 28px;
            text-align: center;
            color: #111111;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
        }

        /* Flask flash messages */

        .flash-message {
            margin: 0 0 16px;
            padding: 11px;
            border-radius: 7px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Form */

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #111827;
        }

        input {
            display: block;
            width: 100%;
            height: 43px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: #15803d;
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.12);
        }

        /* Login button */

        .login-button {
            display: block;
            width: 100%;
            min-height: 43px;
            margin-top: 7px;
            border: none;
            border-radius: 7px;
            background: #15803d;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #166534;
        }

        .login-button:focus-visible {
            outline: 3px solid #86efac;
            outline-offset: 3px;
        }

        /* Bottom spacing */

        .footer-space {
            height: 10px;
            flex-shrink: 0;
        }

        /* Small screens */

        @media (max-width: 480px) {
            .page-container {
                padding: 25px 16px;
            }

            .login-card {
                padding: 28px 22px;
            }

            .login-title {
                font-size: 24px;
            }

            .snsu-logo {
                width: 105px;
                height: 105px;
            }

            .university-name {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Top green bar -->
    <div class="green-bar"></div>

    <main class="page-container">

        <section class="login-card">

            <h1 class="login-title">Pig Feeder IoT</h1>

            <p class="subtitle">
                Sign in to monitor your feeding system
            </p>

            <!-- SNSU logo -->
            <div class="logo-container">
                <img
                    class="snsu-logo"
                    src="{{ url_for('static',
                                    filename='images/snsu-logo.png') }}"
                    alt="SNSU Logo"
                    onerror="this.style.display='none'"
                >
            </div>

            <h2 class="university-name">
                Surigao Del Norte State University
            </h2>

            <!-- Flash messages from Flask -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <p class="flash-message">
                            {{ message }}
                        </p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Login form -->
            <form action="{{ url_for('login') }}" method="post">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="login-button" type="submit">
                    Log In
                </button>

            </form>

        </section>

    </main>

    <!-- Bottom green bar -->
    <div class="green-bar"></div>
    <div class="footer-space"></div>

</body>
</html>
